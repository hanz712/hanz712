name: Update GitHub Profile Metrics

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/metrics.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hanz712
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Jakarta
          config_display: large
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          output_action: commit
          committer_message: "chore: update overview metrics [Skip GitHub Action]"

      - name: Generate languages
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hanz712
          base: ""
          config_timezone: Asia/Jakarta
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used
          output_action: commit
          committer_message: "chore: update languages [Skip GitHub Action]"

      - name: Generate activity
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/activity.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hanz712
          base: ""
          config_timezone: Asia/Jakarta
          plugin_activity: yes
          plugin_activity_limit: 8
          plugin_activity_days: 30
          output_action: commit
          committer_message: "chore: update activity [Skip GitHub Action]"

      - name: Generate coding habits
        uses: lowlighter/metrics@v3.34
        with:
          filename: assets/habits.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: hanz712
          base: ""
          config_timezone: Asia/Jakarta
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_days: 30
          output_action: commit
          committer_message: "chore: update coding habits [Skip GitHub Action]"